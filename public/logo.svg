<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#violet-glow)" stroke-width="6" opacity="0.4" />
  
  <!-- Graph Path -->
  <path d="M 120,380 C 160,340 180,240 240,260 C 300,280 340,160 400,140" fill="none" stroke="url(#violet-glow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 16px rgba(139, 92, 246, 0.6))" />
  
  <!-- Glowing Nodes -->
  <circle cx="120" cy="380" r="24" fill="#ffffff" filter="drop-shadow(0 0 12px rgba(139, 92, 246, 0.8))" />
  <circle cx="240" cy="260" r="24" fill="#ffffff" filter="drop-shadow(0 0 12px rgba(139, 92, 246, 0.8))" />
  <circle cx="400" cy="140" r="24" fill="#ffffff" filter="drop-shadow(0 0 12px rgba(79, 70, 229, 0.8))" />
</svg>
